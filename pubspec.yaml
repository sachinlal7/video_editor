name: vn_editor
description: "A reusable Flutter video editing SDK with native Android and iOS media pipelines."
version: 0.1.0
repository: https://github.com/sachinlal7/video_editor
issue_tracker: https://github.com/sachinlal7/video_editor/issues

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  bloc: ^9.2.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 29.0.8

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.sachinlal.vn_editor
        pluginClass: VnEditorPlugin
      ios:
        pluginClass: VnEditorPlugin
